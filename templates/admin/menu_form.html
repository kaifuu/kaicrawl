{% extends "base.html" %}
{% block header %}{% if menu %}编辑菜单{% else %}新增菜单{% endif %}{% endblock %}
{% block page_icon %}bi bi-list-ul{% endblock %}
{% block page_desc %}配置菜单名称、类型、上级、图标与权限码。{% endblock %}
{% block content %}
<div class="card"><div class="card-body">
  <form method="post">
    <div class="row g-3">
      <div class="col-md-4"><label class="form-label">名称 *</label><input class="form-control" name="name" value="{{ menu.name if menu else '' }}" required></div>
      <div class="col-md-4"><label class="form-label">标识 * <span class="small-muted">（唯一）</span></label><input class="form-control" name="code" value="{{ menu.code if menu else '' }}" required></div>
      <div class="col-md-4"><label class="form-label">类型</label>
        <select class="form-select" name="type">
          {% for v, lbl in type_options %}<option value="{{ v }}" {% if menu and menu.type == v %}selected{% endif %}>{{ lbl }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-4"><label class="form-label">上级菜单</label>
        <select class="form-select" name="parent_id">
          <option value="">— 顶级 —</option>
          {% for pid, plabel in parent_options %}<option value="{{ pid }}" {% if menu and menu.parent_id == pid %}selected{% endif %}>{{ plabel }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-4"><label class="form-label">路径/端点 <span class="small-muted">（菜单填如 sources.index）</span></label><input class="form-control" name="path" value="{{ menu.path if menu else '' }}"></div>
      <div class="col-md-2"><label class="form-label">图标 <span class="small-muted">（emoji）</span></label><input class="form-control" name="icon" value="{{ menu.icon if menu else '' }}"></div>
      <div class="col-md-2"><label class="form-label">排序</label><input class="form-control" name="sort_order" type="number" value="{{ menu.sort_order if menu else 0 }}"></div>
      <div class="col-md-6"><label class="form-label">权限码 <span class="small-muted">（按钮/受控项，如 source:add）</span></label><input class="form-control" name="permission" value="{{ menu.permission if menu else '' }}"></div>
      <div class="col-md-6 d-flex align-items-center"><div class="form-check"><input class="form-check-input" type="checkbox" name="visible" id="vis" {% if menu is none or menu.visible %}checked{% endif %}><label class="form-check-label" for="vis">在侧边栏显示</label></div></div>
      <div class="col-12">
        <button class="btn btn-primary">保存</button>
        <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('admin.menus') }}">返回</a>
      </div>
    </div>
  </form>
</div></div>
{% endblock %}
